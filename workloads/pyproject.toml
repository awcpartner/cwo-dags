[project]
name = "workloads"
version = "1.6.0"
description = "demo dags"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.29",
]

[project.scripts]
caf-perf = "caf_perf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caf_perf"]

[dependency-groups]
dev = [
    "ruff==0.11.6",
]
